[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-docs"
version = "0.1.0"
description = "A Python CLI static site generator for Atlas-style single-page documentation sites."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cydifflib>=1.2.0",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "pyyaml>=6.0",
  "rapidfuzz>=3.14.4",
  "typer>=0.12",
  "watchfiles>=0.21",
]

[project.scripts]
atlas-docs = "atlas_docs.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_docs"]

[tool.hatch.build.targets.wheel.force-include]
"src/atlas_docs/templates" = "atlas_docs/templates"
"src/atlas_docs/themes" = "atlas_docs/themes"
"src/atlas_docs/static" = "atlas_docs/static"
